<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watchlog — трекер аниме</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --bg-card:#141416;
    --bg-card-hover:#1b1b1e;
    --line:#28282c;
    --text:#ededea;
    --text-dim:#8d8d93;
    --text-faint:#55555c;
    --accent:#c62b2b;
    --accent-dim:#5c1717;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    animation:bodyIn .4s ease-out;
  }
  @keyframes bodyIn{from{opacity:0;} to{opacity:1;}}
  ::selection{background:var(--accent); color:#fff;}

  header{
    position:sticky; top:0; z-index:50;
    background:rgba(10,10,11,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:18px 28px;
    display:flex; align-items:center; gap:28px; flex-wrap:wrap;
    animation:slideDown .45s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideDown{from{transform:translateY(-100%);} to{transform:translateY(0);}}
  .logo{
    font-family:'Bebas Neue',sans-serif;
    font-size:28px; letter-spacing:1px;
    display:flex; align-items:center; gap:8px;
  }
  .logo .dot{width:8px;height:8px;background:var(--accent);border-radius:50%;display:inline-block; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(1.3);}}
  nav{display:flex; gap:4px; flex-wrap:wrap;}
  nav button{
    background:none; border:1px solid transparent; color:var(--text-dim);
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.5px;
    padding:8px 14px; border-radius:100px; cursor:pointer; text-transform:uppercase;
    transition:.2s cubic-bezier(.2,.8,.2,1);
  }
  nav button:hover{color:var(--text); border-color:var(--line); transform:translateY(-1px);}
  nav button.active{background:var(--text); color:var(--bg); font-weight:600;}
  .search-wrap{margin-left:auto; display:flex; gap:8px; min-width:240px; flex:1; max-width:420px;}
  #searchInput{
    flex:1; background:var(--bg-card); border:1px solid var(--line); color:var(--text);
    padding:9px 14px; border-radius:8px; font-family:'Inter'; font-size:14px; outline:none;
    transition:.2s;
  }
  #searchInput:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim);}
  #searchBtn{
    background:var(--accent); border:none; color:#fff; padding:9px 16px; border-radius:8px;
    cursor:pointer; font-weight:600; font-size:14px; transition:.15s;
  }
  #searchBtn:hover{background:#a82424; transform:translateY(-1px);}
  #searchBtn:active{transform:translateY(0) scale(.97);}

  main{padding:32px 28px 80px; max-width:1240px; margin:0 auto;}

  .section-title{
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:2px;
    text-transform:uppercase; color:var(--text-faint); margin-bottom:16px;
    display:flex; align-items:center; gap:10px;
  }
  .section-title::after{content:''; flex:1; height:1px; background:var(--line);}

  .filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
  .filter-bar select{
    background:var(--bg-card); border:1px solid var(--line); color:var(--text);
    padding:8px 12px; border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:11px;
    cursor:pointer; text-transform:uppercase; outline:none; transition:.15s;
  }
  .filter-bar select:hover{border-color:var(--text-dim);}
  .filter-bar select:focus{border-color:var(--accent);}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:18px;
  }

  .card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:10px;
    overflow:hidden; cursor:pointer; transition:.25s cubic-bezier(.2,.8,.2,1); position:relative;
    opacity:0; transform:translateY(14px) scale(.98);
    animation:cardIn .45s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes cardIn{to{opacity:1; transform:translateY(0) scale(1);}}
  .card:hover{background:var(--bg-card-hover); border-color:#3a3a40; transform:translateY(-4px); box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .poster-wrap{position:relative; width:100%; aspect-ratio:2/3; background:#1a1a1c; overflow:hidden;}
  .poster-wrap img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s cubic-bezier(.2,.8,.2,1); opacity:0;}
  .poster-wrap img.loaded{opacity:1; animation:imgIn .4s ease-out;}
  @keyframes imgIn{from{opacity:0; filter:blur(6px);} to{opacity:1; filter:blur(0);}}
  .card:hover .poster-wrap img{transform:scale(1.07);}
  .poster-fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, #1c1c1f, #141416);
    color:var(--text-faint); font-family:'Bebas Neue'; font-size:32px; letter-spacing:2px;
  }
  .modal-poster-img.poster-fallback{font-size:44px;}
  .badge{
    position:absolute; top:8px; left:8px; background:var(--accent); color:#fff;
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.5px;
    padding:3px 8px; border-radius:100px; font-weight:600; text-transform:uppercase;
    box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .badge.new{background:#e0a800; animation:badgePulse 1.6s infinite;}
  @keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(224,168,0,.5);} 50%{box-shadow:0 0 0 6px rgba(224,168,0,0);}}
  .card-body{padding:10px 12px 12px;}
  .card-title{font-size:13px; font-weight:600; line-height:1.3; margin-bottom:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-meta{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);
    display:flex; justify-content:space-between; align-items:center;
  }
  .ep-bar{height:3px; background:var(--line); border-radius:2px; margin-top:8px; overflow:hidden;}
  .ep-bar-fill{height:100%; background:var(--accent); width:0; transition:width .6s cubic-bezier(.2,.8,.2,1);}

  .skeleton{background:var(--bg-card); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .skeleton .poster-wrap{background:linear-gradient(100deg, #17171a 30%, #232326 50%, #17171a 70%); background-size:300% 100%; animation:shimmer 1.4s infinite;}
  .skeleton .sk-line{height:10px; background:#1e1e21; border-radius:4px; margin:12px 12px 0;}
  .skeleton .sk-line.short{width:60%; margin-bottom:12px;}
  @keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}

  .empty{
    color:var(--text-faint); font-size:14px; padding:60px 0; text-align:center;
    font-family:'JetBrains Mono',monospace; animation:fadeIn .3s ease-out;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}

  .load-more-wrap{display:flex; justify-content:center; margin-top:28px;}
  #loadMoreBtn{
    background:transparent; border:1px solid var(--line); color:var(--text);
    padding:11px 26px; border-radius:100px; cursor:pointer; font-weight:600; font-size:13px;
    transition:.2s;
  }
  #loadMoreBtn:hover{border-color:var(--accent); color:var(--accent); transform:translateY(-2px);}
  #loadMoreBtn:disabled{opacity:.4; cursor:default; transform:none;}

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0); backdrop-filter:blur(0px);
    display:none; align-items:flex-start; justify-content:center; z-index:100; padding:40px 20px; overflow-y:auto;
    transition:background .25s, backdrop-filter .25s;
  }
  .overlay.show{display:flex; background:rgba(0,0,0,.7); backdrop-filter:blur(4px);}
  .modal{
    background:var(--bg-card); border:1px solid var(--line); border-radius:14px;
    max-width:760px; width:100%; overflow:hidden; animation:pop .3s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop{from{opacity:0; transform:translateY(24px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);}}
  .modal-top{display:flex; gap:20px; padding:24px;}
  .modal-poster{width:160px; min-width:160px; aspect-ratio:2/3; border-radius:8px; overflow:hidden; background:#1a1a1c;}
  .modal-poster img{width:100%; height:100%; object-fit:cover; animation:imgIn .4s ease-out;}
  .modal-info h2{font-family:'Bebas Neue'; font-size:30px; letter-spacing:.5px; margin-bottom:6px;}
  .modal-tags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .tag{
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim);
    border:1px solid var(--line); padding:3px 9px; border-radius:100px; text-transform:uppercase;
  }
  .modal-desc{font-size:13px; color:var(--text-dim); line-height:1.6; max-height:110px; overflow-y:auto;}
  .modal-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  .btn{
    font-family:'Inter'; font-size:13px; font-weight:600; padding:9px 16px; border-radius:8px;
    border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer; transition:.18s;
  }
  .btn:hover{border-color:var(--text-dim); transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.96);}
  .btn.primary{background:var(--text); color:var(--bg); border-color:var(--text);}
  .btn.primary:hover{background:#fff;}
  .btn.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.watch{background:var(--accent-dim); border-color:var(--accent); color:#ffb3b3;}

  .modal-bottom{border-top:1px solid var(--line); padding:20px 24px;}
  .progress-row{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .progress-row input[type=range]{flex:1; accent-color:var(--accent);}
  .progress-num{font-family:'JetBrains Mono',monospace; font-size:13px; min-width:70px; text-align:right;}
  .close-x{
    position:absolute; top:14px; right:14px; background:var(--bg); border:1px solid var(--line);
    width:30px; height:30px; border-radius:50%; color:var(--text-dim); cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .close-x:hover{color:var(--text); transform:rotate(90deg); border-color:var(--accent);}
  .modal-wrap{position:relative;}

  @media (max-width:560px){
    .modal-top{flex-direction:column;}
    .modal-poster{width:120px; margin:0 auto;}
    header{padding:14px 16px; gap:12px;}
    .search-wrap{order:3; max-width:none; width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span>WATCHLOG</div>
  <nav>
    <button data-tab="watching" class="active">Смотрю</button>
    <button data-tab="plan">Хочу посмотреть</button>
    <button data-tab="tracked">Отслеживаю</button>
    <button data-tab="catalog">Каталог</button>
  </nav>
  <div class="search-wrap">
    <input id="searchInput" placeholder="Найти аниме…" autocomplete="off">
    <button id="searchBtn">Искать</button>
  </div>
</header>

<main>
  <div id="searchSection" style="display:none;">
    <div class="section-title">Результаты поиска</div>
    <div class="grid" id="searchGrid"></div>
  </div>

  <div id="catalogSection" style="display:none;">
    <div class="section-title">Каталог</div>
    <div class="filter-bar">
      <select id="filterStatus">
        <option value="">Любой статус</option>
        <option value="ongoing">Онгоинг</option>
        <option value="released">Вышло</option>
        <option value="anons">Анонс</option>
      </select>
      <select id="filterKind">
        <option value="">Любой тип</option>
        <option value="tv">TV</option>
        <option value="movie">Фильм</option>
        <option value="ova">OVA</option>
        <option value="ona">ONA</option>
        <option value="special">Спешл</option>
      </select>
      <select id="filterOrder">
        <option value="popularity">По популярности</option>
        <option value="ranked">По рейтингу</option>
        <option value="aired_on">По дате выхода</option>
        <option value="name">По названию</option>
      </select>
    </div>
    <div class="grid" id="catalogGrid"></div>
    <div class="load-more-wrap"><button id="loadMoreBtn">Показать ещё</button></div>
  </div>

  <div id="listSection">
    <div class="section-title" id="listTitle">Смотрю</div>
    <div class="grid" id="listGrid"></div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal-wrap">
    <div class="modal" id="modalContent"></div>
  </div>
</div>

<script>
const DB_KEY = 'watchlog_db_v1';
const API = 'https://watchlog.a27012010aa.workers.dev/api';

function loadDB(){
  try{ return JSON.parse(localStorage.getItem(DB_KEY)) || {}; }catch(e){ return {}; }
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let db = loadDB();

function imgUrl(anime){
  const path = anime.image ? (anime.image.original || anime.image.preview) : '';
  if(!path) return '';
  return path.startsWith('http') ? path : 'https://watchlog.a27012010aa.workers.dev/api' + path;
}

function isMissingPoster(anime){
  const path = anime.image ? (anime.image.original || anime.image.preview || '') : '';
  return !path || /missing/i.test(path);
}

const fallbackCache = {};
const fallbackQueue = [];
let fallbackProcessing = false;

function enqueueFallback(anime){
  if(fallbackCache[anime.id] !== undefined) return;
  fallbackCache[anime.id] = null;
  fallbackQueue.push(anime);
  processFallbackQueue();
}

async function processFallbackQueue(){
  if(fallbackProcessing) return;
  fallbackProcessing = true;
  while(fallbackQueue.length){
    const anime = fallbackQueue.shift();
    const url = await fetchFallbackPoster(anime);
    fallbackCache[anime.id] = url;
    if(url){
      document.querySelectorAll(`[data-poster-id="${anime.id}"]`).forEach(el => {
        const extraClass = el.dataset.extraClass || '';
        el.outerHTML = `<img class="${extraClass}" src="${url}" loading="lazy" alt="" onload="this.classList.add('loaded')">`;
      });
    }
    await new Promise(r => setTimeout(r, 350));
  }
  fallbackProcessing = false;
}

async function fetchFromJikan(anime){
  const res = await fetch(`https://api.jikan.moe/v4/anime/${anime.id}`);
  if(!res.ok) throw new Error('jikan miss');
  const data = await res.json();
  const img = data?.data?.images?.jpg?.large_image_url || data?.data?.images?.webp?.large_image_url;
  if(!img) throw new Error('jikan no image');
  return img;
}

async function fetchFromKitsu(anime){
  const q = encodeURIComponent(anime.russian || anime.name || '');
  const res = await fetch(`https://kitsu.io/api/edge/anime?filter[text]=${q}&page[limit]=1`);
  if(!res.ok) throw new Error('kitsu miss');
  const data = await res.json();
  const img = data?.data?.[0]?.attributes?.posterImage?.large || data?.data?.[0]?.attributes?.posterImage?.original;
  if(!img) throw new Error('kitsu no image');
  return img;
}

async function fetchFallbackPoster(anime){
  try{
    return await Promise.any([fetchFromJikan(anime), fetchFromKitsu(anime)]);
  }catch(e){
    return null;
  }
}

function posterHtml(anime, extraClass){
  const title = anime.russian || anime.name || '';
  if(isMissingPoster(anime)){
    if(fallbackCache[anime.id]){
      return `<img class="${extraClass||''}" src="${fallbackCache[anime.id]}" loading="lazy" alt="" onload="this.classList.add('loaded')">`;
    }
    enqueueFallback(anime);
    return `<div class="poster-fallback ${extraClass||''}" data-poster-id="${anime.id}" data-extra-class="${extraClass||''}"><span>${title.slice(0,2).toUpperCase()}</span></div>`;
  }
  return `<img class="${extraClass||''}" src="${imgUrl(anime)}" loading="lazy" alt="" onload="this.classList.add('loaded')">`;
}

function skeletonGrid(container, count){
  container.innerHTML = '';
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'skeleton';
    el.innerHTML = `<div class="poster-wrap"></div><div class="sk-line"></div><div class="sk-line short"></div>`;
    container.appendChild(el);
  }
}

const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchSection = document.getElementById('searchSection');
const searchGrid = document.getElementById('searchGrid');
const listSection = document.getElementById('listSection');
const catalogSection = document.getElementById('catalogSection');
const catalogGrid = document.getElementById('catalogGrid');
const loadMoreBtn = document.getElementById('loadMoreBtn');
const filterStatus = document.getElementById('filterStatus');
const filterKind = document.getElementById('filterKind');
const filterOrder = document.getElementById('filterOrder');

function hideAllSections(){
  searchSection.style.display = 'none';
  catalogSection.style.display = 'none';
  listSection.style.display = 'none';
}

async function doSearch(){
  const q = searchInput.value.trim();
  if(!q) return;
  hideAllSections();
  searchSection.style.display = 'block';
  skeletonGrid(searchGrid, 12);
  try{
    const res = await fetch(`${API}/animes?search=${encodeURIComponent(q)}&limit=18&order=popularity`);
    const data = await res.json();
    if(!data.length){ searchGrid.innerHTML = '<div class="empty">Ничего не нашлось</div>'; return; }
    searchGrid.innerHTML = '';
    data.forEach((a, i) => searchGrid.appendChild(renderCard(a, i)));
  }catch(e){
    searchGrid.innerHTML = '<div class="empty">Ошибка запроса к Shikimori. Проверь интернет.</div>';
  }
}
searchBtn.onclick = doSearch;
searchInput.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });

let currentTab = 'watching';
let catalogPage = 1;

document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    hideAllSections();
    searchInput.value = '';
    if(currentTab === 'catalog'){
      catalogSection.style.display = 'block';
      catalogPage = 1;
      loadCatalog(true);
    }else{
      listSection.style.display = 'block';
      renderList();
    }
  };
});

async function loadCatalog(reset){
  if(reset){
    catalogPage = 1;
    skeletonGrid(catalogGrid, 18);
  }
  loadMoreBtn.disabled = true;
  loadMoreBtn.textContent = 'Загрузка…';
  const params = new URLSearchParams({
    limit: 18,
    page: catalogPage,
    order: filterOrder.value || 'popularity'
  });
  if(filterStatus.value) params.set('status', filterStatus.value);
  if(filterKind.value) params.set('kind', filterKind.value);
  try{
    const res = await fetch(`${API}/animes?${params.toString()}`);
    const data = await res.json();
    if(reset) catalogGrid.innerHTML = '';
    if(!data.length && reset){
      catalogGrid.innerHTML = '<div class="empty">Ничего не нашлось по этим фильтрам</div>';
    }else{
      data.forEach((a, i) => catalogGrid.appendChild(renderCard(a, i)));
    }
    loadMoreBtn.disabled = false;
    loadMoreBtn.textContent = 'Показать ещё';
  }catch(e){
    if(reset) catalogGrid.innerHTML = '<div class="empty">Ошибка запроса к Shikimori</div>';
    loadMoreBtn.disabled = false;
    loadMoreBtn.textContent = 'Показать ещё';
  }
}
loadMoreBtn.onclick = () => { catalogPage++; loadCatalog(false); };
[filterStatus, filterKind, filterOrder].forEach(sel => sel.onchange = () => loadCatalog(true));

function renderList(){
  const titles = {watching:'Смотрю', plan:'Хочу посмотреть', tracked:'Отслеживаю'};
  document.getElementById('listTitle').textContent = titles[currentTab] || '';
  const grid = document.getElementById('listGrid');
  grid.innerHTML = '';
  const items = Object.values(db).filter(a => {
    if(currentTab === 'watching') return a.status_local === 'watching';
    if(currentTab === 'plan') return a.status_local === 'plan';
    if(currentTab === 'tracked') return a.tracked;
  });
  if(!items.length){
    grid.innerHTML = `<div class="empty">Пусто. Найди аниме через поиск или каталог и добавь сюда.</div>`;
    return;
  }
  items.forEach((a, i) => grid.appendChild(renderCard(a, i)));
}

function renderCard(anime, index){
  const stored = db[anime.id];
  const el = document.createElement('div');
  el.className = 'card';
  el.style.animationDelay = `${Math.min(index, 20) * 35}ms`;
  const isNew = stored && stored._hasNewEpisode;
  const total = anime.episodes || stored?.episodes || '?';
  const aired = anime.episodes_aired ?? stored?.episodes_aired ?? '?';
  const fillPct = total && total !== '?' && total > 0 ? Math.min(100, (aired/total)*100) : 0;
  el.innerHTML = `
    <div class="poster-wrap">
      ${posterHtml(anime)}
      ${isNew ? '<span class="badge new">Новая серия</span>' : (stored?.tracked ? '<span class="badge">Отслеживается</span>' : '')}
    </div>
    <div class="card-body">
      <div class="card-title">${anime.russian || anime.name}</div>
      <div class="card-meta"><span>${aired}/${total} эп.</span><span>${anime.kind || ''}</span></div>
      <div class="ep-bar"><div class="ep-bar-fill" data-fill="${fillPct}"></div></div>
    </div>
  `;
  el.onclick = () => openModal(anime, stored);
  requestAnimationFrame(() => {
    const fill = el.querySelector('.ep-bar-fill');
    if(fill) fill.style.width = fill.dataset.fill + '%';
  });
  return el;
}

const overlay = document.getElementById('overlay');
const modalContent = document.getElementById('modalContent');

async function openModal(anime, stored){
  overlay.classList.add('show');
  modalContent.innerHTML = `<div class="empty" style="padding:60px;">Загрузка…</div>`;
  let full = anime;
  try{
    const res = await fetch(`${API}/animes/${anime.id}`);
    full = await res.json();
  }catch(e){}

  const rec = db[full.id] || { id: full.id };
  const watchedEp = rec.watched_episodes || 0;
  const totalEp = full.episodes || rec.episodes || 0;
  const airedEp = full.episodes_aired ?? rec.episodes_aired ?? 0;

  const desc = (full.description || 'Описание недоступно.').replace(/\[.*?\]/g, '').slice(0, 500);
  const searchQuery = encodeURIComponent(full.russian || full.name);

  modalContent.innerHTML = `
    <button class="close-x" id="closeModal">✕</button>
    <div class="modal-top">
      <div class="modal-poster">${posterHtml(full, 'modal-poster-img')}</div>
      <div class="modal-info">
        <h2>${full.russian || full.name}</h2>
        <div class="modal-tags">
          <span class="tag">${full.kind || '—'}</span>
          <span class="tag">${full.status === 'released' ? 'вышло' : full.status === 'ongoing' ? 'онгоинг' : (full.status || '—')}</span>
          <span class="tag">${airedEp}/${totalEp || '?'} эп.</span>
          ${full.score ? `<span class="tag">★ ${full.score}</span>` : ''}
        </div>
        <div class="modal-desc">${desc}${desc.length >= 500 ? '…' : ''}</div>
        <div class="modal-actions">
          <button class="btn ${rec.status_local==='watching'?'on':''}" id="btnWatching">Смотрю</button>
          <button class="btn ${rec.status_local==='plan'?'on':''}" id="btnPlan">Хочу посмотреть</button>
          <button class="btn ${rec.tracked?'on':''}" id="btnTrack">${rec.tracked ? '✓ Отслеживается' : 'Отслеживать'}</button>
          <a class="btn watch" target="_blank" href="https://www.google.com/search?q=site:kodik.info+${searchQuery}">Смотреть (Kodik) ↗</a>
        </div>
      </div>
    </div>
    ${rec.status_local === 'watching' ? `
    <div class="modal-bottom">
      <div class="section-title" style="margin-bottom:12px;">Прогресс просмотра</div>
      <div class="progress-row">
        <input type="range" id="epRange" min="0" max="${totalEp || airedEp || 50}" value="${watchedEp}">
        <div class="progress-num" id="epNum">${watchedEp}/${totalEp || '?'}</div>
      </div>
    </div>` : ''}
  `;

  document.getElementById('closeModal').onclick = closeModal;

  document.getElementById('btnWatching').onclick = () => {
    updateAnime(full, {status_local: rec.status_local === 'watching' ? null : 'watching'});
    openModal(full);
  };
  document.getElementById('btnPlan').onclick = () => {
    updateAnime(full, {status_local: rec.status_local === 'plan' ? null : 'plan'});
    openModal(full);
  };
  document.getElementById('btnTrack').onclick = () => {
    updateAnime(full, {tracked: !rec.tracked, episodes_aired: airedEp, _hasNewEpisode:false});
    openModal(full);
  };
  const range = document.getElementById('epRange');
  if(range){
    range.oninput = () => {
      document.getElementById('epNum').textContent = `${range.value}/${totalEp || '?'}`;
    };
    range.onchange = () => updateAnime(full, {watched_episodes: parseInt(range.value)});
  }
}

function closeModal(){
  overlay.classList.remove('show');
  if(currentTab !== 'catalog') renderList();
}
overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };

function updateAnime(anime, patch){
  const existing = db[anime.id] || {
    id: anime.id, name: anime.name, russian: anime.russian,
    image: anime.image, episodes: anime.episodes, episodes_aired: anime.episodes_aired, kind: anime.kind
  };
  db[anime.id] = { ...existing, ...patch };
  if(!db[anime.id].status_local && !db[anime.id].tracked){
    delete db[anime.id];
  }
  saveDB(db);
}

async function checkNewEpisodes(){
  const tracked = Object.values(db).filter(a => a.tracked);
  for(const a of tracked){
    try{
      const res = await fetch(`${API}/animes/${a.id}`);
      const fresh = await res.json();
      if(fresh.episodes_aired > (a.episodes_aired || 0)){
        db[a.id]._hasNewEpisode = true;
        db[a.id].episodes = fresh.episodes;
      }
    }catch(e){}
  }
  saveDB(db);
  if(currentTab !== 'catalog') renderList();
}

renderList();
checkNewEpisodes();
</script>

</body>
</html>
